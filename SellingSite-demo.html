<!DOCTYPE html>
<html>
    <meta charset="UTF=8">
    <meta name="viewpoint" content="width=device-width, inital-scale=0.1"
<head>
  <title>Simple Product Site</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background: #f2f2f2;
    }

    header {
      background: #333;
      color: white;
      padding: 15px;
      text-align: center;
      position: relative;
    }

    header button {
      position: absolute;
      right: 20px;
      top: 15px;
      padding: 8px 14px;
      background: #007bff;
      border: none;
      color: white;
      cursor: pointer;
    }

    .slider {
      width: 90%;
      max-width: 500px;
      margin: 30px auto;
      border: 2px solid #ccc;
      border-radius: 5px;
      overflow: hidden;
    }

    .slider img {
      width: 100%;
      display: none;
    }

    .slider img.active {
      display: block;
    }

    .controls {
      text-align: center;
      margin-top: 10px;
    }

    .controls button {
      padding: 5px 10px;
      margin: 0 5px;
    }

    /* Sign-up Form Popup */
    .signup-form {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      padding: 20px;
      width: 250px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      border-radius: 8px;
      z-index: 1000;
    }

    .signup-form input {
      width: 100%;
      margin: 8px 0;
      padding: 8px;
    }

    .signup-form button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    .close-btn {
      background: red;
      color: white;
      border: none;
    }
	.products{
			display:flex;
			flex-wrap:wrap;	         /*wrap to next row*/
			gap:10px;                /*space between img*/
			justify-content:center;  /* all the content in center*/
		}
		.product{
			background:white;
			padding:15px;
			border:1px solid;
			text-align:center;
			width:300px;
		}
		.product img{	
			width:100%;
			height:auto;
		}
  </style>
</head>
<body>

<header>
  <h2>Simple Shop</h2>
  <button onclick="openForm()">Sign Up</button>
</header>

<!-- Product Slider -->
<div class="slider">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQTq4MMQWhU4WqZAktEsKFsJSo1hlCgNJzJ0w&s" class="active" alt="Product 1">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRqnaBVJFAgqUapjR0eSfJbxaqWfqZs2ktY8g&s" alt="Product 2">
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTdoQIB0Sr2r2LcrRVNeJQgoIbl84pD6vthHw&s" alt="Product 3">
</div>

<div class="controls">
  <button onclick="prevSlide()">Prev</button>
  <button onclick="nextSlide()">Next</button>
</div>

<!-- Sign-Up Form -->
<div class="signup-form" id="formBox">
  <h3>Sign Up</h3>
  <input type="text" placeholder="Name" id="name">
  <input type="email" placeholder="Email" id="email">
  <input type="password" placeholder="Password" id="pass">
  <button onclick="submitForm()">Register</button>
  <button class="close-btn" onclick="closeForm()">Close</button>
  <p id="msg" style="color:red;"></p>
</div>

<script>
  // Sign-up Form
  function openForm() {
    document.getElementById("formBox").style.display = "block";
  }

  function closeForm() {
    document.getElementById("formBox").style.display = "none";
    document.getElementById("msg").textContent = "";
  }

  function submitForm() {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const pass = document.getElementById("pass").value.trim();
    const msg = document.getElementById("msg");

    if (!name || !email || !pass) {
      msg.textContent = "All fields required.";
    } else {
      msg.style.color = "green";
      msg.textContent = "Signed up successfully!";
    }
  }

  // Image Slider
  let current = 0;
  const images = document.querySelectorAll(".slider img");

  function showSlide(index) {
    images.forEach((img, i) => {
      img.classList.toggle("active", i === index);
    });
  }

  function nextSlide() {
    current = (current + 1) % images.length;
    showSlide(current);
  }

  function prevSlide() {
    current = (current - 1 + images.length) % images.length;
    showSlide(current);
  }

  // Auto Slide (optional)
  setInterval(nextSlide, 5000);
</script>
