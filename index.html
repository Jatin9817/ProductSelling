<DOCTYPE html!>
<html>
<head>
  <meta charset="UTF=8">
  <meta name="viewpoint" content="width=device-width, inital-scale=1.0">
  <title>Sample Store</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <!-- Top nav bar-->
    <div class="navTop">
      <div class="navItem">
        <span class="brandname">Brand</span>
      </div>

      <div class="navItem">
        <div class="search">
          <input type="text" placeholder="Search.." class="searchInput">
          <img height="20px" weidth="20px" src="/img/search.png">
        </div>
      </div>

      <div class="navItem">
        <span class="limittedoffer">Limited Offer!</span>
      </div>
    </div>

    <!--bottom nav bar -->
    <div class="navBottom">
      <h3 class="menuitem">AIR FORCE</h3>
      <h3 class="menuitem">JORDAN</h3>
      <h3 class="menuitem">BLAZER</h3>
      <h3 class="menuitem">CREATER</h3>
      <h3 class="menuitem">HIPPER</h3>
    </div>
  </nav>

  <!-- Imager slider-->
  <div class="slider">
    <div class="sliderwrapper">
      <div class="slideritem">
        <img src="./img/air.png" alt="" class="sliderimg">
        <div class="sliderbg"></div>
        <h1 class="slidertitle">AIR FORCE <br> NEW <br> SEASON</h1>
        <h2 class="sliderprice">$119</h2>
        <button class="buybutton">BUT NOW</button>
      </div>

      <div class="slideritem">
        <img src="./img/jordan.png" alt="" class="sliderimg">
        <div class="sliderbg"></div>
        <h1 class="slidertitle">AIR JORDAN <br> NEW <br> SEASON</h1>
        <h2 class="sliderprice">$149</h2>
        <button class="buybutton">BUT NOW</button>
      </div>

      <div class="slideritem">
        <img src="./img/blazer.png" alt="" class="sliderimg">
        <div class="sliderbg"></div>
        <h1 class="slidertitle">BLAZER <br> NEW <br> SEASON</h1>
        <h2 class="sliderprice">$109</h2>
        <button class="buybutton">BUT NOW</button>
      </div>

      <div class="slideritem">
        <img src="./img/crater.png" alt="" class="sliderimg">
        <div class="sliderbg"></div>
        <h1 class="slidertitle">CREATER <br> NEW <br> SEASON</h1>
        <h2 class="sliderprice">$129</h2>
        <button class="buybutton">BUT NOW</button>
      </div>

      <div class="slideritem">
        <img src="./img/hippie.png" alt="" class="sliderimg">
        <div class="sliderbg"></div>
        <h1 class="slidertitle">HIPPER <br> NEW <br> SEASON</h1>
        <h2 class="sliderprice">$99</h2>
        <button class="buybutton">BUT NOW</button>
      </div>

    </div>
  </div>

<script src="./script.js"></script>
</body>
</html>
